<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny GPT</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --card:#292524; --line:#44403c; --accent:#f59e0b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:24px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  textarea, input { width:100%; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .row { display:flex; gap:12px; margin:12px 0; flex-wrap:wrap; }
  .row label { flex:1; min-width:140px; font-size:13px; color:var(--muted); }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  pre { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; min-height:200px; font:14px/1.5 ui-monospace, monospace; }
  pre b { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Tiny GPT</h1>
  <p class="sub">A ~3M-parameter character-level transformer trained from scratch on Shakespeare.</p>
  <textarea id="prompt" rows="3">ROMEO:
</textarea>
  <div class="row">
    <label>Tokens <input id="n" type="number" value="400" min="1" max="2000"></label>
    <label>Temperature <input id="t" type="number" value="0.8" step="0.1" min="0.1" max="2"></label>
    <label>Top-k <input id="k" type="number" value="40" min="0" max="65"></label>
  </div>
  <button id="go">Generate</button>
  <pre id="out"></pre>
</main>
<script>
const $ = id => document.getElementById(id);
$("go").onclick = async () => {
  $("go").disabled = true;
  const prompt = $("prompt").value;
  $("out").innerHTML = "";
  const b = document.createElement("b"); b.textContent = prompt; $("out").appendChild(b);
  const gen = document.createTextNode(""); $("out").appendChild(gen);
  try {
    const res = await fetch("/stream", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, max_new_tokens: +$("n").value, temperature: +$("t").value, top_k: +$("k").value }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) { const { done, value } = await reader.read(); if (done) break; gen.data += dec.decode(value); }
  } catch (e) { gen.data += "\n[error: " + e.message + "]"; }
  $("go").disabled = false;
};
</script>
</body>
</html>
